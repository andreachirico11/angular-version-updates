<div class="signup-container">
  <h2>User Registration OLDDDDDDDDDDDDDDD</h2>

  <form [formGroup]="signupForm" (submit)="onSubmit($event)">

    <div class="form-group">
      <label for="firstName">First Name</label>
      <input type="text" id="firstName" formControlName="firstName"
        placeholder="Enter your first name" />
      <app-old-form-error [fieldControl]="signupForm.controls.firstName" />
    </div>

    <div class="form-group">
      <label for="lastName">Last Name</label>
      <input type="text" id="lastName" formControlName="lastName"
        placeholder="Enter your last name" />
      <app-old-form-error [fieldControl]="signupForm.controls.lastName" />
    </div>

    <div class="form-group">
      <label>Reaction</label>
      <old-reaction-picker formControlName="reaction" />
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" formControlName="email"
        placeholder="example@email.com" />
      <app-old-form-error [fieldControl]="signupForm.controls.email" />
    </div>

    <div class="form-group checkbox-group">
      <label>
        <input type="checkbox" formControlName="notifyByEmail" />
        Receive email notifications
      </label>
    </div>

    <div class="form-actions">
      <button type="submit" [disabled]="submitting() || !signupForm.valid">
        Sign Up
      </button>
      <button type="button">
        Reset
      </button>
    </div>

  </form>

  <app-debug-info [value]="signupFormValue | async" [valid]="signupForm.valid" />
</div>
