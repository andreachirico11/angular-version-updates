<div class="signup-container">
  <h2>User Registration</h2>

  <form (submit)="onSubmit($event)">

    <div class="form-group">
      <label for="firstName">First Name</label>
      <input type="text" id="firstName" [field]="signupForm.firstName"
        placeholder="Enter your first name" />
      <app-form-error [fieldControl]="signupForm.firstName()" />
    </div>

    <div class="form-group">
      <label for="lastName">Last Name</label>
      <input type="text" id="lastName" [field]="signupForm.lastName"
        placeholder="Enter your last name" /><app-form-error
        [fieldControl]="signupForm.lastName()" />
    </div>

    <div class="form-group">
      <label for="lastName">Reaction</label>
      <reaction-picker [field]="signupForm.reaction" />
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" [field]="signupForm.email"
        placeholder="example@email.com" />
      <app-form-error [fieldControl]="signupForm.email()" />
    </div>

    <div class="form-group checkbox-group">
      <label>
        <input type="checkbox" [field]="signupForm.notifyByEmail" />
        Receive email notifications
      </label>
    </div>

    <div class="form-actions">
      <button type="submit"
        [disabled]="signupForm().submitting() || !signupForm().valid()">
        Sign Up
      </button>
      <button type="button">
        Reset
      </button>
    </div>

  </form>

  <app-debug-info [value]="signupForm().value()" [valid]="signupForm().valid()"/>
</div>
