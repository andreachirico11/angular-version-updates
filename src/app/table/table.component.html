<div class="table-container">
  <div class="table-header">
    <h3>Gestione Veicoli</h3>
    <span class="table-count">{{ vehicles()?.length }} veicoli</span>
  </div>

  <div class="table-wrapper">
    <table class="data-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Marca</th>
          <th>Modello</th>
          <th>Anno</th>
          <th>Targa</th>
          <th>Km</th>
          <th>Stato</th>
          <th>Azioni</th>
        </tr>
      </thead>
      <tbody>
        @for (vehicle of vehicles(); track vehicle.plate) {
          <app-table-row [vehicle]="vehicle" />
        }
      </tbody>
    </table>
  </div>
</div>
