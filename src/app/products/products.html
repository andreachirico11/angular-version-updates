<div class="pricing-container" appMouseDown>
  <div class="selector-wrapper">
    <label for="product">Product Category: </label>
    @let options = ['premium', 'standard', 'basic', 'enterprise', 'starter',
    'professional'];
    <select id="product" name="product" [ngModel]="productType()"
      (ngModelChange)="productType.set($event)">
      @for (option of options; track option) {
      <option [ngValue]="option">{{ option }}</option>
      }
    </select>
  </div>
  <p class="price-info">{{ `The ${productName()} package costs
    ${price} for ${productType()} tier` }}</p>
  <p class="offer-banner" appMouseDown>{{ formatPrice`Upgrade ${productName()}
    to
    ${productType()} and save ${discount()}% today!` }}</p>
</div>
