<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angular Version Updates</title>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1976d2 0%, #dd0031 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 40px;
            border-radius: 8px 8px 0 0;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
            border-top: 5px solid #dd0031;
        }

        .header-content {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .angular-logo {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #dd0031 0%, #c3002f 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(221, 0, 49, 0.3);
        }

        h1 {
            color: #1976d2;
            font-size: 2.2em;
            font-weight: 500;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
            margin-top: 5px;
        }

        select {
            width: 100%;
            padding: 14px 18px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 4px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            color: #333;
            font-weight: 500;
        }

        select:hover {
            border-color: #1976d2;
            box-shadow: 0 2px 8px rgba(25, 118, 210, 0.2);
        }

        select:focus {
            outline: none;
            border-color: #dd0031;
            box-shadow: 0 2px 8px rgba(221, 0, 49, 0.2);
        }

        .content {
            background: white;
            padding: 50px;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
            min-height: 500px;
        }

        .markdown-body {
            line-height: 1.7;
            color: #333;
            font-size: 16px;
        }

        .markdown-body h1,
        .markdown-body h2,
        .markdown-body h3 {
            margin-top: 32px;
            margin-bottom: 16px;
            font-weight: 500;
            line-height: 1.3;
            color: #1976d2;
        }

        .markdown-body h1 {
            font-size: 2.2em;
            border-bottom: 3px solid #dd0031;
            padding-bottom: 12px;
            margin-top: 0;
        }

        .markdown-body h2 {
            font-size: 1.8em;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 10px;
        }

        .markdown-body h3 {
            font-size: 1.4em;
            color: #333;
        }

        .markdown-body h4 {
            font-size: 1.2em;
            color: #555;
            margin-top: 24px;
            margin-bottom: 12px;
        }

        .markdown-body p {
            margin-bottom: 16px;
            text-align: justify;
        }

        .markdown-body ul,
        .markdown-body ol {
            margin-bottom: 16px;
            padding-left: 30px;
        }

        .markdown-body li {
            margin-bottom: 10px;
        }

        .markdown-body code {
            background: #f5f5f5;
            padding: 3px 8px;
            border-radius: 3px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 0.9em;
            color: #dd0031;
            border: 1px solid #e0e0e0;
        }

        .markdown-body pre {
            background: #263238;
            padding: 20px;
            border-radius: 4px;
            overflow-x: auto;
            margin-bottom: 20px;
            border-left: 4px solid #dd0031;
        }

        .markdown-body pre code {
            background: none;
            padding: 0;
            color: #aed581;
            border: none;
            font-size: 0.95em;
        }

        .markdown-body blockquote {
            border-left: 4px solid #1976d2;
            padding-left: 20px;
            color: #555;
            margin-bottom: 20px;
            background: #f5f9fc;
            padding: 16px 20px;
            border-radius: 0 4px 4px 0;
            font-style: italic;
        }

        .markdown-body a {
            color: #1976d2;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }

        .markdown-body a:hover {
            border-bottom: 1px solid #1976d2;
        }

        .markdown-body table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 20px;
            border: 1px solid #e0e0e0;
        }

        .markdown-body th,
        .markdown-body td {
            border: 1px solid #e0e0e0;
            padding: 12px 16px;
            text-align: left;
        }

        .markdown-body th {
            background: linear-gradient(135deg, #1976d2 0%, #1565c0 100%);
            color: white;
            font-weight: 500;
        }

        .markdown-body tr:nth-child(even) {
            background: #f9f9f9;
        }

        .markdown-body img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            margin: 20px 0;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .markdown-body strong {
            color: #dd0031;
            font-weight: 600;
        }

        .placeholder {
            text-align: center;
            color: #999;
            padding: 80px 20px;
        }

        .placeholder-icon {
            font-size: 64px;
            margin-bottom: 20px;
            color: #1976d2;
            opacity: 0.3;
        }

        /* Badge Angular-style */
        .markdown-body em {
            background: #fff3e0;
            color: #e65100;
            padding: 2px 8px;
            border-radius: 3px;
            font-style: normal;
            font-size: 0.9em;
        }

        /* Scrollbar personalizzata */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #1976d2;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #1565c0;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <div class="angular-logo">A</div>
                <div>
                    <h1>Angular Version Updates</h1>
                    <div class="subtitle">Select an Angular version</div>
                </div>
            </div>
            <select id="fileSelect">
                <option value=""></option>
            </select>
        </div>
        <div class="content">
            <div id="markdownContent" class="placeholder">
            </div>
        </div>
    </div>
    <script src="fileNames.js"></script>
    <script src="script.js"></script>
</body>

</html>
